<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matchly - Login</title>
    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="login.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-brand">
            <a href="homepage.html">Match<span>ly</span></a>
        </div>
        
        <div class="auth-card">
            <h2>Welcome Back</h2>
            <p class="auth-subtitle">Log in to your Matchly account</p>

            <form class="auth-form" action="homepage.html" method="GET">
                <div class="form-group">
                    <label for="email">Email Address or ID</label>
                    <input type="text" id="email" class="form-input" placeholder="Enter your email or ID" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="Enter your password" required>
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#" class="forgot-link">Forgot Password?</a>
                </div>

                <button type="submit" class="btn btn--primary w-100 btn--large">Log In</button>
            </form>

            <div class="auth-footer">
                <p>Don't have an account? <a href="register.html">Sign Up</a></p>
            </div>
        </div>
    </div>
</body>
</html>
